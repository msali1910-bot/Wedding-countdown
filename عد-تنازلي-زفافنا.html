<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العد التنازلي لزفافنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#230b14;
    --bg-mid:#4a1b2b;
    --bg-mid2:#5c2436;
    --gold:#d4af7a;
    --gold-bright:#f2ddac;
    --blush:#e8b4b8;
    --ink-light:#f6e9dd;
    --ink-soft:#d9c3b8;
    --ring-track:rgba(212,175,122,0.18);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, var(--bg-mid2) 0%, var(--bg-mid) 42%, var(--bg-deep) 100%);
    background-attachment:fixed;
    color:var(--ink-light);
    font-family:'Tajawal', sans-serif;
    overflow-x:hidden;
  }

  .pattern{
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 20%, var(--gold) 0.5px, transparent 0.5px),
      radial-gradient(circle at 60% 70%, var(--gold) 0.5px, transparent 0.5px),
      radial-gradient(circle at 85% 30%, var(--gold) 0.5px, transparent 0.5px);
    background-size: 120px 120px, 160px 160px, 140px 140px;
    opacity:0.12;
    pointer-events:none;
  }

  .page{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: clamp(28px, 6vw, 64px) 20px;
    animation: fadeIn 1.1s ease-out;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    letter-spacing: 0.35em;
    font-size: clamp(11px, 2vw, 13px);
    color: var(--gold);
    text-transform:none;
    margin-bottom: 14px;
    opacity:0.9;
  }

  .title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(28px, 6vw, 46px);
    color: var(--gold-bright);
    text-shadow: 0 0 22px rgba(212,175,122,0.35);
    margin-bottom: clamp(28px, 5vw, 40px);
    line-height:1.4;
  }

  /* halo + moon signature */
  .halo-wrap{
    position:relative;
    width: clamp(160px, 34vw, 220px);
    height: clamp(160px, 34vw, 220px);
    margin-bottom: clamp(30px, 5vw, 44px);
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.03); }
  }

  .halo-wrap svg{ position:absolute; inset:0; transform:rotate(-90deg); }

  .ring-track{
    fill:none;
    stroke: var(--ring-track);
    stroke-width: 3;
  }

  .ring-progress{
    fill:none;
    stroke: url(#goldGrad);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 6px rgba(242,221,172,0.55));
  }

  .moon{
    position:absolute;
    inset: 22%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright) 0%, var(--gold) 55%, #9c7845 100%);
    box-shadow:
      0 0 26px rgba(242,221,172,0.45),
      inset -6px -6px 14px rgba(60,30,15,0.35);
  }

  .progress-label{
    position:absolute;
    bottom:-2px; left:50%;
    transform:translate(-50%, 100%);
    font-size:12px;
    color: var(--ink-soft);
    letter-spacing:0.05em;
    white-space:nowrap;
  }

  /* countdown */
  .days-big{
    font-weight:900;
    font-size: clamp(64px, 16vw, 110px);
    line-height:1;
    color: var(--ink-light);
    text-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  .days-label{
    font-size: clamp(15px, 3vw, 18px);
    color: var(--gold-bright);
    margin-top:6px;
    letter-spacing:0.06em;
    font-weight:500;
  }

  .sub-clock{
    display:flex;
    gap: clamp(14px, 4vw, 26px);
    margin-top: clamp(22px, 4vw, 32px);
  }

  .unit{ display:flex; flex-direction:column; align-items:center; min-width:56px; }
  .unit .val{
    font-size: clamp(22px, 5vw, 30px);
    font-weight:700;
    color: var(--ink-light);
  }
  .unit .lbl{
    font-size:12px;
    color: var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.04em;
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    width: min(320px, 70vw);
    margin: clamp(34px, 6vw, 48px) 0 clamp(18px, 3vw, 22px);
  }
  .divider .line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0.6; }
  .divider .gem{ color:var(--gold); font-size:12px; transform:rotate(45deg); }

  .quote{
    font-family:'Aref Ruqaa', serif;
    font-size: clamp(17px, 3.4vw, 21px);
    color: var(--blush);
    max-width: 420px;
    line-height:1.9;
    margin-bottom: clamp(28px, 5vw, 40px);
  }

  .dates-row{
    display:flex;
    gap: clamp(10px, 3vw, 18px);
    flex-wrap:wrap;
    justify-content:center;
  }
  .chip{
    border: 1px solid rgba(212,175,122,0.4);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    background: rgba(212,175,122,0.06);
  }
  .chip b{ color:var(--gold-bright); font-weight:600; }

  .celebrate{
    font-family:'Aref Ruqaa', serif;
    font-size: clamp(30px, 6vw, 44px);
    color: var(--gold-bright);
    text-shadow: 0 0 26px rgba(212,175,122,0.5);
  }

  @media (prefers-reduced-motion: reduce){
    .page, .halo-wrap{ animation:none; }
  }
</style>
</head>
<body>
<div class="pattern"></div>
<div class="page">

  <div class="eyebrow">عهدٌ بيننا</div>
  <div class="title">ليلة العمر تقترب<br>خطوة خطوة</div>

  <div class="halo-wrap">
    <svg viewBox="0 0 220 220">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f2ddac"/>
          <stop offset="100%" stop-color="#d4af7a"/>
        </linearGradient>
      </defs>
      <circle class="ring-track" cx="110" cy="110" r="98"></circle>
      <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="98"></circle>
    </svg>
    <div class="moon"></div>
    <div class="progress-label" id="progressLabel">٪٠ من الطريق</div>
  </div>

  <div id="countdownArea">
    <div class="days-big" id="daysBig">0</div>
    <div class="days-label">يومًا يفصلنا عن فرحتنا</div>

    <div class="sub-clock">
      <div class="unit"><div class="val" id="hoursVal">00</div><div class="lbl">ساعة</div></div>
      <div class="unit"><div class="val" id="minutesVal">00</div><div class="lbl">دقيقة</div></div>
      <div class="unit"><div class="val" id="secondsVal">00</div><div class="lbl">ثانية</div></div>
    </div>
  </div>

  <div class="divider"><div class="line"></div><div class="gem">◆</div><div class="line"></div></div>

  <div class="quote" id="quoteText">كل يوم يمر خطوة نحو بيتنا الصغير</div>

  <div class="dates-row">
    <div class="chip">من <b>٢٨ أغسطس ٢٠٢٦</b></div>
    <div class="chip">إلى <b>٢٧ يوليو ٢٠٢٩</b></div>
  </div>

</div>

<script>
  const start = new Date('2026-08-28T00:00:00');
  const end   = new Date('2029-07-27T00:00:00');

  const quotes = [
    "كل يوم يمر خطوة نحو بيتنا الصغير",
    "الانتظار حين يكون لأجلك يصبح جميلاً",
    "قريبًا... يزفّ القمر إلى بدره",
    "بيننا الآن أيام، وغدًا تصير ذكرى نرويها",
    "الشوق اليوم، وعدٌ بفرحةٍ في الغد",
    "كل غروبٍ يقرّبنا من ليلة العمر",
    "الصبر مفتاحٌ، وفرحتنا قادمة لا محالة"
  ];

  const daysBig = document.getElementById('daysBig');
  const hoursVal = document.getElementById('hoursVal');
  const minutesVal = document.getElementById('minutesVal');
  const secondsVal = document.getElementById('secondsVal');
  const quoteText = document.getElementById('quoteText');
  const progressLabel = document.getElementById('progressLabel');
  const ringProgress = document.getElementById('ringProgress');
  const countdownArea = document.getElementById('countdownArea');

  const radius = 98;
  const circumference = 2 * Math.PI * radius;
  ringProgress.style.strokeDasharray = circumference;

  const arabicIndic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function toArabicNumber(n){
    return String(n).split('').map(d => arabicIndic[d] !== undefined ? arabicIndic[d] : d).join('');
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function update(){
    const now = new Date();
    let diff = end - now;
    const totalMs = end - start;
    let elapsed = now - start;
    let progress = Math.min(100, Math.max(0, (elapsed / totalMs) * 100));

    const offset = circumference * (1 - progress / 100);
    ringProgress.style.strokeDashoffset = offset;
    progressLabel.textContent = toArabicNumber(Math.floor(progress)) + '٪ من الطريق';

    if (diff <= 0){
      countdownArea.innerHTML = '<div class="celebrate">تزوّجنا! 🤍</div>';
      quoteText.textContent = "وصلنا... وبدأت حكايتنا الحقيقية";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    daysBig.textContent = toArabicNumber(days);
    hoursVal.textContent = toArabicNumber(pad(hours));
    minutesVal.textContent = toArabicNumber(pad(minutes));
    secondsVal.textContent = toArabicNumber(pad(seconds));

    const dayIndex = Math.floor((now - start) / 86400000);
    quoteText.textContent = quotes[((dayIndex % quotes.length) + quotes.length) % quotes.length];
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العد التنازلي لزفافنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#230b14;
    --bg-mid:#4a1b2b;
    --bg-mid2:#5c2436;
    --gold:#d4af7a;
    --gold-bright:#f2ddac;
    --blush:#e8b4b8;
    --ink-light:#f6e9dd;
    --ink-soft:#d9c3b8;
    --ring-track:rgba(212,175,122,0.18);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, var(--bg-mid2) 0%, var(--bg-mid) 42%, var(--bg-deep) 100%);
    background-attachment:fixed;
    color:var(--ink-light);
    font-family:'Tajawal', sans-serif;
    overflow-x:hidden;
  }

  .pattern{
    position:fixed; inset:0;
    background-image:
      radial-gradient(circle at 20% 20%, var(--gold) 0.5px, transparent 0.5px),
      radial-gradient(circle at 60% 70%, var(--gold) 0.5px, transparent 0.5px),
      radial-gradient(circle at 85% 30%, var(--gold) 0.5px, transparent 0.5px);
    background-size: 120px 120px, 160px 160px, 140px 140px;
    opacity:0.12;
    pointer-events:none;
  }

  .page{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: clamp(28px, 6vw, 64px) 20px;
    animation: fadeIn 1.1s ease-out;
  }

  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .eyebrow{
    letter-spacing: 0.35em;
    font-size: clamp(11px, 2vw, 13px);
    color: var(--gold);
    text-transform:none;
    margin-bottom: 14px;
    opacity:0.9;
  }

  .names{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(20px, 4.5vw, 28px);
    color: var(--blush);
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  .names .amp{
    color: var(--gold);
    margin: 0 8px;
    font-family:'Tajawal', sans-serif;
    font-weight:300;
  }

  .title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size: clamp(28px, 6vw, 46px);
    color: var(--gold-bright);
    text-shadow: 0 0 22px rgba(212,175,122,0.35);
    margin-bottom: clamp(28px, 5vw, 40px);
    line-height:1.4;
  }

  /* halo + moon signature */
  .halo-wrap{
    position:relative;
    width: clamp(160px, 34vw, 220px);
    height: clamp(160px, 34vw, 220px);
    margin-bottom: clamp(30px, 5vw, 44px);
    animation: breathe 5s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.03); }
  }

  .halo-wrap svg{ position:absolute; inset:0; transform:rotate(-90deg); }

  .ring-track{
    fill:none;
    stroke: var(--ring-track);
    stroke-width: 3;
  }

  .ring-progress{
    fill:none;
    stroke: url(#goldGrad);
    stroke-width: 3;
    stroke-linecap: round;
    transition: stroke-dashoffset 1s linear;
    filter: drop-shadow(0 0 6px rgba(242,221,172,0.55));
  }

  .moon{
    position:absolute;
    inset: 22%;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, var(--gold-bright) 0%, var(--gold) 55%, #9c7845 100%);
    box-shadow:
      0 0 26px rgba(242,221,172,0.45),
      inset -6px -6px 14px rgba(60,30,15,0.35);
  }

  .progress-label{
    position:absolute;
    bottom:-2px; left:50%;
    transform:translate(-50%, 100%);
    font-size:12px;
    color: var(--ink-soft);
    letter-spacing:0.05em;
    white-space:nowrap;
  }

  /* countdown */
  .days-big{
    font-weight:900;
    font-size: clamp(64px, 16vw, 110px);
    line-height:1;
    color: var(--ink-light);
    text-shadow: 0 4px 24px rgba(0,0,0,0.35);
  }
  .days-label{
    font-size: clamp(15px, 3vw, 18px);
    color: var(--gold-bright);
    margin-top:6px;
    letter-spacing:0.06em;
    font-weight:500;
  }

  .sub-clock{
    display:flex;
    gap: clamp(14px, 4vw, 26px);
    margin-top: clamp(22px, 4vw, 32px);
  }

  .unit{ display:flex; flex-direction:column; align-items:center; min-width:56px; }
  .unit .val{
    font-size: clamp(22px, 5vw, 30px);
    font-weight:700;
    color: var(--ink-light);
  }
  .unit .lbl{
    font-size:12px;
    color: var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.04em;
  }

  .divider{
    display:flex; align-items:center; gap:12px;
    width: min(320px, 70vw);
    margin: clamp(34px, 6vw, 48px) 0 clamp(18px, 3vw, 22px);
  }
  .divider .line{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--gold), transparent); opacity:0.6; }
  .divider .gem{ color:var(--gold); font-size:12px; transform:rotate(45deg); }

  .quote{
    font-family:'Aref Ruqaa', serif;
    font-size: clamp(17px, 3.4vw, 21px);
    color: var(--blush);
    max-width: 420px;
    line-height:1.9;
    margin-bottom: clamp(28px, 5vw, 40px);
  }

  .dates-row{
    display:flex;
    gap: clamp(10px, 3vw, 18px);
    flex-wrap:wrap;
    justify-content:center;
  }
  .chip{
    border: 1px solid rgba(212,175,122,0.4);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 13px;
    color: var(--ink-soft);
    background: rgba(212,175,122,0.06);
  }
  .chip b{ color:var(--gold-bright); font-weight:600; }

  .celebrate{
    font-family:'Aref Ruqaa', serif;
    font-size: clamp(30px, 6vw, 44px);
    color: var(--gold-bright);
    text-shadow: 0 0 26px rgba(212,175,122,0.5);
  }

  :root[data-theme="dawn"]{--bg-deep:#3b1f2c;--bg-mid:#5e3445;--bg-mid2:#86505f;--gold:#f0c9a0;--gold-bright:#ffe6c7;--blush:#f7c6cf;}
  :root[data-theme="night"]{--bg-deep:#0a1226;--bg-mid:#14284a;--bg-mid2:#22406b;--gold:#d9c28a;--gold-bright:#f3e6bd;--blush:#aebfe8;}
  .stars i{position:fixed;width:2px;height:2px;border-radius:50%;background:var(--gold-bright);animation:tw 4s ease-in-out infinite;pointer-events:none}
  @keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}
  .bank{width:min(420px,100%);margin:6px 0 26px}
  .bank h2{font-family:'Aref Ruqaa',serif;color:var(--gold-bright);font-size:22px;margin-bottom:12px}
  .accts{display:flex;gap:12px}
  .acct{flex:1;border:1px solid rgba(212,175,122,.4);border-radius:16px;padding:14px 8px;background:rgba(212,175,122,.06)}
  .acct .nm{color:var(--blush);font-weight:700}
  .acct small{display:block;color:var(--ink-soft);font-size:11px;margin-top:2px}
  .acct .bal{font-size:34px;font-weight:900;margin:6px 0}
  .acct .btns{display:flex;gap:6px;justify-content:center}
  .bank button,.tools button{font:inherit;cursor:pointer;color:var(--ink-light);background:rgba(212,175,122,.14);border:1px solid rgba(212,175,122,.45);border-radius:999px;padding:6px 12px;font-size:13px}
  .tools button.on{background:var(--gold);color:var(--bg-deep)}
  .logl{list-style:none;margin-top:14px;text-align:right;font-size:13px;color:var(--ink-soft)}
  .logl li{padding:6px 0;border-bottom:1px dashed rgba(212,175,122,.2)}
  .sug{margin-top:12px;font-size:13px;color:var(--blush);text-align:right}
  .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:22px}

  @media (prefers-reduced-motion: reduce){
    .page, .halo-wrap, .stars i{ animation:none; }
  }
</style>
</head>
<body>
<div class="pattern"></div>
<div class="page">

  <div class="eyebrow">عهدٌ بيننا</div>
  <div class="names">محمد <span class="amp">&amp;</span> مريم</div>
  <div class="title">ليلة العمر تقترب<br>خطوة خطوة</div>

  <div class="halo-wrap">
    <svg viewBox="0 0 220 220">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#f2ddac"/>
          <stop offset="100%" stop-color="#d4af7a"/>
        </linearGradient>
      </defs>
      <circle class="ring-track" cx="110" cy="110" r="98"></circle>
      <circle id="ringProgress" class="ring-progress" cx="110" cy="110" r="98"></circle>
    </svg>
    <div class="moon"></div>
    <div class="progress-label" id="progressLabel">٪٠ من الطريق</div>
  </div>

  <div id="countdownArea">
    <div class="days-big" id="daysBig">0</div>
    <div class="days-label">يومًا يفصلنا عن فرحتنا</div>

    <div class="sub-clock">
      <div class="unit"><div class="val" id="hoursVal">00</div><div class="lbl">ساعة</div></div>
      <div class="unit"><div class="val" id="minutesVal">00</div><div class="lbl">دقيقة</div></div>
      <div class="unit"><div class="val" id="secondsVal">00</div><div class="lbl">ثانية</div></div>
    </div>
  </div>

  <div class="divider"><div class="line"></div><div class="gem">◆</div><div class="line"></div></div>

  <div class="quote" id="quoteText">كل يوم يمر خطوة نحو بيتنا الصغير</div>

  <section class="bank">
    <h2>بنك البوسات 💋</h2>
    <div class="accts">
      <div class="acct"><div class="nm">محمد</div><small>بوسات من مريم</small><div class="bal" id="balm">٠</div><div class="btns"><button onclick="act('m',1)">＋</button><button onclick="act('m',-1)">−</button></div></div>
      <div class="acct"><div class="nm">مريم</div><small>بوسات من محمد</small><div class="bal" id="balr">٠</div><div class="btns"><button onclick="act('r',1)">＋</button><button onclick="act('r',-1)">−</button></div></div>
    </div>
    <div id="sugBox"></div>
    <ul class="logl" id="logList"></ul>
    <div class="sug" id="bankNote"></div>
  </section>

  <div class="dates-row">
    <div class="chip">من <b>١٧ يوليو ٢٠٢٦</b></div>
    <div class="chip">إلى <b>٢٧ يوليو ٢٠٢٩</b></div>
  </div>
  <div class="tools">
    <button id="themeBtn">🎨 الشكل</button>
    <span id="tzBtns"></span>
    <button id="loginBtn" onclick="login()">🔒 دخول محمد</button>
    <i id="stars" class="stars"></i>
  </div>

</div>

<script>
  const start = new Date('2026-07-17T00:00:00');
  const MODES = {auto:'', summer:'+03:00', winter:'+02:00'};
  const store = {get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
  let mode = store.get('dst') || 'auto';
  const mkEnd = () => new Date('2029-07-27T20:00:00' + (MODES[mode] || ''));
  let end = mkEnd();

  const quotes = [
    "كل يوم يمر خطوة نحو بيتنا الصغير",
    "الانتظار حين يكون لأجلك يصبح جميلاً",
    "قريبًا... يزفّ القمر إلى بدره",
    "بيننا الآن أيام، وغدًا تصير ذكرى نرويها",
    "الشوق اليوم، وعدٌ بفرحةٍ في الغد",
    "كل غروبٍ يقرّبنا من ليلة العمر",
    "الصبر مفتاحٌ، وفرحتنا قادمة لا محالة",
    "بيتنا يكبر في القلب قبل أن يُبنى",
    "نعدّ الأيام لأننا نحبّ الوصول",
    "أيامنا تُحسب، وحبّنا لا يُحسب",
    "كل يوم حجرٌ جديد في بيت الحلم",
    "مهما طال الطريق، وجهته واحدة",
    "نكتب الآن مقدّمة حكايتنا الجميلة",
    "قلبان يتدرّبان على الانتظار الجميل",
    "كل رسالة بيننا لبنةٌ في طريق الزفاف",
    "يومٌ آخر، والفرح أقرب",
    "ننتظر الفرح كما ينتظر البحر القمر",
    "في الحكاية فصولٌ جميلة لم تُكتب بعد",
    "هدوء الانتظار يسبق ضجيج الفرحة",
    "كل يوم نختار بعضنا من جديد",
    "نعبر الأيام يدًا بيد",
    "كل عدٍّ تنازلي يبدأ بوعد، وبدأنا بوعدنا",
    "نحوّل الشوق إلى خطط، والخطط إلى بيت",
    "كل ضحكة اليوم رصيدٌ لحياتنا القادمة",
    "نتعلّم معًا كيف نكون بيتًا",
    "الغد أقرب مما نظن",
    "هذه اللحظة ستُحكى لأولادنا يومًا",
    "الأيام جسرٌ، والفرحة في آخره",
    "كلما مرّ يوم، كبر الشوق وكبرت الفرحة",
    "نحن نحبّ بصبر، ونحلم بثقة",
    "ما أجمل أن يكون الغد موعدًا",
    "لكل انتظارٍ نهاية، ونهايتنا فرح",
    "سنضحك يومًا على هذا العدّ التنازلي",
    "أجمل الأشياء تأتي لمن يحسن الانتظار",
    "اليوم أحبّ من الأمس بقليل",
    "كل خطوةٍ صغيرة تقرّبنا من الحلم الكبير",
    "الحب عادةٌ جميلة نكررها كل يوم",
    "نصنع الآن ذكريات ستؤثّث بيتنا",
    "بين الشوق والصبر مسافةٌ اسمها الأمل",
    "مهما شغلتنا الأيام، نلتقي عند الفرح",
    "كل يوم يمرّ يُنقص العدّ ويزيد الحنين",
    "نحن نبني حياة، لا حفلة فقط",
    "ثقتنا ببعضنا أجمل ما نملك اليوم"
  ];

  const daysBig = document.getElementById('daysBig');
  const hoursVal = document.getElementById('hoursVal');
  const minutesVal = document.getElementById('minutesVal');
  const secondsVal = document.getElementById('secondsVal');
  const quoteText = document.getElementById('quoteText');
  const progressLabel = document.getElementById('progressLabel');
  const ringProgress = document.getElementById('ringProgress');
  const countdownArea = document.getElementById('countdownArea');

  const radius = 98;
  const circumference = 2 * Math.PI * radius;
  ringProgress.style.strokeDasharray = circumference;

  const arabicIndic = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];
  function toArabicNumber(n){
    return String(n).split('').map(d => arabicIndic[d] !== undefined ? arabicIndic[d] : d).join('');
  }

  function pad(n){ return String(n).padStart(2,'0'); }

  function update(){
    const now = new Date();
    let diff = end - now;
    const totalMs = end - start;
    let elapsed = now - start;
    let progress = Math.min(100, Math.max(0, (elapsed / totalMs) * 100));

    const offset = circumference * (1 - progress / 100);
    ringProgress.style.strokeDashoffset = offset;
    progressLabel.textContent = toArabicNumber(Math.floor(progress)) + '٪ من الطريق';

    if (diff <= 0){
      countdownArea.innerHTML = '<div class="celebrate">تزوّجنا! 🤍</div>';
      quoteText.textContent = "وصلنا... وبدأت حكايتنا الحقيقية";
      return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    daysBig.textContent = toArabicNumber(days);
    hoursVal.textContent = toArabicNumber(pad(hours));
    minutesVal.textContent = toArabicNumber(pad(minutes));
    secondsVal.textContent = toArabicNumber(pad(seconds));

    const dayIndex = Math.floor((now - start) / 86400000);
    const MS = {500:'٥٠٠ يوم بس.. والحكاية بتحلو',365:'سنة واحدة تفصلنا عن الفرح',100:'مئة يوم على ليلة العمر',30:'شهر واحد.. العدّ بدأ يضيق',7:'أسبوع واحد! جهّزوا القلوب',1:'بكرة ليلة العمر'};
    quoteText.textContent = MS[days] || quotes[((dayIndex % quotes.length) + quotes.length) % quotes.length];
  }

  // themes
  const themes = ['wine','dawn','night'];
  let th = store.get('th') || 'wine';
  const setTh = () => { document.documentElement.dataset.theme = th; };
  setTh();
  document.getElementById('themeBtn').onclick = () => { th = themes[(themes.indexOf(th)+1) % themes.length]; store.set('th', th); setTh(); };

  // summer / winter time
  const tz = document.getElementById('tzBtns');
  [['auto','تلقائي'],['summer','صيفي'],['winter','شتوي']].forEach(([k,l]) => {
    const b = document.createElement('button');
    b.textContent = l; b.dataset.k = k;
    b.onclick = () => { mode = k; store.set('dst', k); end = mkEnd(); paint(); update(); };
    tz.appendChild(b);
  });
  function paint(){ tz.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.k === mode)); }
  paint();

  // twinkling stars
  const st = document.getElementById('stars');
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('i');
    s.style.top = (Math.random()*100) + 'vh';
    s.style.left = (Math.random()*100) + 'vw';
    s.style.animationDelay = (Math.random()*4) + 's';
    st.appendChild(s);
  }

  update();
  setInterval(update, 1000);
</script>

<script type="module">
  import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {getDatabase, ref, push, onValue, remove} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
  import {getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const cfg = {
    apiKey:"AIzaSyB4PfUxiKX_q5MXo8i9R8RbeSc7Gald7P8",
    authDomain:"weeding-counter.firebaseapp.com",
    databaseURL:"https://weeding-counter-default-rtdb.firebaseio.com",
    projectId:"weeding-counter",
    appId:"1:526950014691:web:d7012b279eb156a1e9afd6"
  };
  const $ = id => document.getElementById(id);
  const ar = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const names = {m:'محمد', r:'مريم'};
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const valid = v => v && (v.who === 'm' || v.who === 'r') && (v.d === 1 || v.d === -1) && typeof v.reason === 'string';

  if (cfg.apiKey === "PASTE") {
    $('bankNote').textContent = 'بنك البوسات قيد الإعداد';
    $('loginBtn').style.display = 'none';
    window.act = () => alert('بنك البوسات لسه قيد الإعداد');
  } else {
    const app = initializeApp(cfg), db = getDatabase(app), auth = getAuth(app);
    let admin = false, log = {}, sug = {};

    function render() {
      const bal = {m:0, r:0};
      const L = Object.values(log).filter(valid).sort((a,b) => b.t - a.t);
      L.forEach(v => bal[v.who] += v.d);
      $('balm').textContent = ar(bal.m);
      $('balr').textContent = ar(bal.r);
      $('logList').innerHTML = L.slice(0,8).map(v => `<li>${v.d > 0 ? '＋' : '−'} ${names[v.who]} — ${esc(v.reason.slice(0,80))}</li>`).join('');
      const S = Object.entries(sug).filter(([id,v]) => /^[-\w]+$/.test(id) && valid(v));
      $('sugBox').innerHTML = S.length ? '<div class="sug">اقتراحات تنتظر موافقة محمد:' + S.map(([id,v]) =>
        `<div>${v.d > 0 ? '＋' : '−'} ${names[v.who]} — ${esc(v.reason.slice(0,80))} ` +
        (admin ? `<button onclick="appr('${id}')">✔</button> <button onclick="rej('${id}')">✖</button>` : '') + '</div>').join('') + '</div>' : '';
      $('bankNote').textContent = admin ? '' : 'أي ضغطة هتتبعت كاقتراح لمحمد يوافق عليه';
      $('loginBtn').textContent = admin ? '🔓 خروج' : '🔒 دخول محمد';
    }

    onValue(ref(db, 'log'), s => { log = s.val() || {}; render(); });
    onValue(ref(db, 'sug'), s => { sug = s.val() || {}; render(); });
    onAuthStateChanged(auth, u => { admin = !!u; render(); });

    window.act = async (who, d) => {
      const reason = prompt(d > 0 ? 'بوسة عن إيه؟' : 'الخصم بسبب إيه؟');
      if (!reason) return;
      try { await push(ref(db, admin ? 'log' : 'sug'), {who, d, reason: reason.slice(0,80), t: Date.now()}); }
      catch (e) { alert('تعذّر الحفظ'); }
    };
    window.appr = async id => {
      const it = sug[id]; if (!it) return;
      try { await push(ref(db, 'log'), it); await remove(ref(db, 'sug/' + id)); } catch (e) { alert('تعذّر الحفظ'); }
    };
    window.rej = id => remove(ref(db, 'sug/' + id)).catch(() => alert('تعذّر الحذف'));
    window.login = async () => {
      if (admin) { signOut(auth); return; }
      const em = prompt('الإيميل'); if (!em) return;
      const pw = prompt('كلمة السر'); if (!pw) return;
      try { await signInWithEmailAndPassword(auth, em, pw); } catch (e) { alert('بيانات غلط'); }
    };
  }
</script>
</body>
</html>
